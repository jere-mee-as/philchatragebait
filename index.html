/* Layout: one 640px column. Screen 1 "Who are you?" — a grid of face+name pills. Screen 2 — the generator:
   picker (face + name) → the line in a book serif → Shuffle left, two reaction buttons right. Credit pinned bottom-right. */
:root{
  --bg:#ffffff; --ink:#18181a; --soft:#55555c; --muted:#8b8b93; --line:#e8e8ec; --hover:#f4f4f6; --fill:#f6f6f8; --pop:#ffffff; --ring:#ececf0;
  --shadow:0 12px 32px -12px rgba(20,20,30,.22),0 0 0 1px rgba(20,20,30,.06);
  --rage:#e0412f;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --ink:#ececee; --soft:#b0b0b8; --muted:#76767e; --line:#222226; --hover:#17171a; --fill:#131315; --pop:#141416; --ring:#202024;
  --shadow:0 16px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); --rage:#ff6a57; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --ink:#ececee; --soft:#b0b0b8; --muted:#76767e; --line:#222226; --hover:#17171a; --fill:#131315; --pop:#141416; --ring:#202024;
  --shadow:0 16px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); --rage:#ff6a57; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);transition:background-color .4s,color .4s;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:64px 96px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:64px}
.mark{font-size:14px;color:var(--muted);letter-spacing:.01em;text-decoration:none;border-radius:6px;transition:opacity .2s}
.mark:hover{opacity:.7}
.mark:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.mark b{font-weight:500;color:var(--ink)}
.mark{white-space:nowrap}
body.on-gen header{margin-bottom:22px}
body.on-gen .mark{font:400 15px var(--sans);color:var(--muted)}.mark .gen{opacity:.6}
.actions{display:flex;align-items:center;gap:4px}
.icon{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,background-color .2s}
.icon:hover{color:var(--ink);background:var(--hover)}
.icon svg{width:16px;height:16px}
.textbtn{font:400 13px var(--sans);color:var(--muted);background:transparent;border:0;cursor:pointer;padding:8px 10px;border-radius:999px}
.textbtn:hover{color:var(--ink);background:var(--hover)}
.screen[hidden]{display:none!important}

.av{position:relative;flex:none;border-radius:50%;background:var(--ring);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-weight:500}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s20{width:20px;height:20px;font-size:9px}
.av.s28{width:28px;height:28px;font-size:11px}
.av.s34{width:34px;height:34px;font-size:13px}
.av.s40{width:40px;height:40px;font-size:15px}
.av.s72{width:72px;height:72px;font-size:24px}
.av.s56{width:52px;height:52px;font-size:18px}
.av.s60{width:60px;height:60px;font-size:20px}
.stack{display:flex}
.stack .av{box-shadow:0 0 0 2.5px var(--bg)}
.stack .av+.av{margin-left:-9px}

/* ---------- Who are you ---------- */
.who-h{font:400 clamp(26px,4.6vw,33px)/1.1 var(--serif);letter-spacing:-.015em;margin:0 0 40px;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:26px 8px}
.pill{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;border:0;background:transparent;cursor:pointer;color:var(--soft);font:400 12.5px var(--sans);padding:8px 2px;border-radius:14px;
  opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards;transition:background-color .2s,color .2s}
.pill .nm{max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:center;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.pill .av{transition:transform .25s}
.pill:hover{background:var(--hover);color:var(--ink)}
.pill:hover .av{transform:scale(1.05)}
@keyframes rise{to{opacity:1;transform:none}}
.leaving .pill{animation:out .3s ease-in forwards!important}
@keyframes out{to{opacity:0;transform:translateY(-6px)}}
.who-skip{margin-top:28px;align-self:center}

/* ---------- Generator ---------- */
.gen{animation:in .5s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.picker{position:relative;flex:1;min-width:0}
.trigger{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:0;padding:6px 14px 6px 6px;margin-left:-6px;border-radius:999px;color:var(--ink);text-align:left;font:inherit;transition:background-color .2s}
.trigger.can{cursor:pointer}
.trigger.can:hover{background:var(--hover)}
.trigger .n{font:400 20px var(--serif);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trigger .chev{margin-left:auto;width:17px;height:17px;color:var(--muted);flex:none;opacity:0;transform:translateY(-4px);transition:opacity .5s,transform .5s}
.trigger.can .chev{opacity:1;transform:none}
.picker.open .chev{transform:rotate(180deg)}
.trigger .chev.breathe{animation:breathe 1.5s ease-in-out}
@keyframes breathe{0%,100%{transform:none;color:var(--muted)}30%{transform:scale(1.45);color:var(--ink)}55%{transform:scale(1.05)}75%{transform:scale(1.3);color:var(--ink)}}
.anyav{min-width:52px;height:52px;display:flex;align-items:center;flex:none}
.pop{position:absolute;left:-6px;right:-6px;top:calc(100% + 8px);z-index:20;background:var(--pop);border-radius:14px;box-shadow:var(--shadow);padding:6px;
  opacity:0;transform:translateY(-4px) scale(.985);transform-origin:top center;pointer-events:none;transition:opacity .18s,transform .18s}
.picker.open .pop{opacity:1;transform:none;pointer-events:auto}
.search{width:100%;font:400 15px var(--sans);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 10px 10px;outline:none}
.search::placeholder{color:var(--muted)}
.list{list-style:none;margin:6px 0 0;padding:0;max-height:420px;overflow-y:auto;overscroll-behavior:contain}
.list li{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--soft)}
.list li[aria-selected="true"]{color:var(--ink);font-weight:500}
.list li.act{background:var(--hover);color:var(--ink)}
.list li .tick{margin-left:auto;width:13px;height:13px;opacity:0}
.list li[aria-selected="true"] .tick{opacity:1}
.list li.fresh{opacity:0;animation:rise .4s ease-out forwards}
.list .empty{color:var(--muted);cursor:default}

/* Unlock 2 · Faces: a strip of other chatters slides in beside the picker */
.others{display:none;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);font:400 13px var(--sans);padding:6px 12px 6px 6px;border-radius:999px;transition:background-color .2s,color .2s}
.others:hover{background:var(--hover);color:var(--ink)}
.others.show{display:inline-flex;animation:slide .6s cubic-bezier(.2,.7,.2,1)}
.others .stack .av{width:24px;height:24px;font-size:9px}
.others .stack .av+.av{margin-left:-9px}
@keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
/* Unlock 1 · Quiet: the chevron fades in and the face gets one soft ring pulse */
.ringpulse{animation:ring 1.4s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--muted)}100%{box-shadow:0 0 0 14px transparent}}

.line{margin:52px 0 0;min-height:200px}
.out{margin:0;font:400 clamp(19px,3.3vw,23px)/1.55 var(--serif);letter-spacing:-.002em;color:var(--ink);overflow-wrap:anywhere;text-wrap:pretty}
.out.enter{animation:enter .6s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.for{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);min-height:30px}
.for b{font-weight:500;color:var(--soft)}
.for:empty{visibility:hidden}

.mid{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;margin-top:34px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:26px}
.back{display:none;align-items:center;justify-content:center;width:38px;height:38px;color:var(--soft);background:transparent;border:1px solid var(--line);border-radius:50%;padding:0;cursor:pointer;transition:border-color .2s,color .2s,transform .12s}
.back:hover{border-color:var(--muted);color:var(--ink)}
.back:active{transform:scale(.96)}
.back svg{width:16px;height:16px;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.back:hover svg{transform:rotate(-40deg)}
.back.show{display:inline-flex;animation:backin .35s cubic-bezier(.2,.7,.2,1)}
@keyframes backin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.shuffle{display:inline-flex;align-items:center;gap:8px;font:500 13.5px var(--sans);color:var(--bg);background:var(--ink);border:0;border-radius:999px;padding:10px 18px 10px 15px;cursor:pointer;transition:transform .12s,background-color .4s,color .4s}
.shuffle:active{transform:scale(.96)}
.shuffle svg{width:14px;height:14px;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.reacts{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.ask{font:italic 400 14.5px var(--serif);color:var(--muted);margin-right:4px;white-space:nowrap}
@media (max-width:400px){.ask{font-size:13.5px}}
.react{width:46px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:transparent;border-radius:999px;cursor:pointer;transition:border-color .2s,background-color .2s,transform .15s}
.react:hover{border-color:var(--muted)}
.react img{width:24px;height:auto;display:block;transition:transform .2s}
.react .emo{font-size:19px;line-height:1;display:inline-block}
.react:hover img{transform:scale(1.08) rotate(-4deg)}
.react[aria-pressed="true"]{background:var(--fill);border-color:var(--ink)}
.react.rage[aria-pressed="true"]{border-color:var(--rage)}
.react.rage.go img{animation:rage .55s ease-out}
@keyframes rage{0%{transform:scale(1)}15%{transform:scale(1.35) translateX(-3px) rotate(-6deg)}30%{transform:scale(1.35) translateX(3px) rotate(6deg)}45%{transform:scale(1.3) translateX(-3px) rotate(-4deg)}60%{transform:scale(1.25) translateX(2px)}100%{transform:scale(1)}}
.react.rage.go{animation:heat .6s ease-out}
@keyframes heat{0%{box-shadow:0 0 0 0 var(--rage)}100%{box-shadow:0 0 0 12px transparent}}
.react.nah:hover .emo{animation:shake .6s ease-in-out}
.react.nah.go .emo{animation:shake .7s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-8deg)}40%{transform:translateX(4px) rotate(8deg)}60%{transform:translateX(-3px) rotate(-5deg)}80%{transform:translateX(2px) rotate(3deg)}}

.credit{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);z-index:5}
.credit b{font-weight:500;color:var(--soft)}


button:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
.search:focus-visible{outline:none;border-bottom-color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){
  .picker{flex-basis:100%}
  .others{margin:-2px 0 0 60px}
  .trigger .n{font-size:19px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;text-wrap:balance}
  .credit{position:static;justify-content:flex-end;margin:64px auto 0;max-width:540px}
  body{padding-block:36px 72px} header{margin-bottom:48px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 8px}
  .foot{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pill,.list li.fresh{opacity:1;transform:none}}
</style>

s retarded.", "So you're going to leave free money on the table because a computer guessed you would? That's retarded.", "DFW is retarded and the footnotes are a cry for help."], "u": "anonymousjohnson", "s": "AJ"}, {"n": "Ape", "a": ["Hume showed induction can't be justified, and every argument against Hume uses induction, so every refutation of Hume is circular. He's undefeated and you're mad about it, retard.", "The Given has to be a myth, because Sellars said so, and Sellars is hard to read, and hard to read means correct. That's analytic philosophy's whole quality-control system.", "There's a hard problem because science describes structure, experience isn't structure, so science can't describe experience. You just keep calling that a 'misconception' because you don't like the conclusion.", "Two-boxing is rational because rationality is about doing the best thing at the moment of choice, and at that moment the money is already there. Your 'virtuous dispositions' are just paying a predictor for vibes.", "Analytic philosophy is better because it's clearer, and it's clearer because it uses symbols, and symbols are clearer because they're math. Which is why mathematicians read so much analytic philosophy. (They don't.)", "Mathematical truths need proof to be known, so before Wiles nobody knew anything about Fermat. Including Fermat.", "Monty Hall is 50/50, because there are two doors left, and probability is just counting doors. Every other explanation is mathematicians showing off.", "Woke derangement syndrome can't exist because you can't be deranged by something that's actually crazy. Hope that helps.", "Tate has good points about discipline, discipline is good, so Tate is good. Same reason the guy who robs you is a role model for punctuality.", "Huemer is clear, and clarity is truth's best friend, so phenomenal conservatism is true. It seems right to me, so I'm justified. See how well it works?", "Peer disagreement should make you suspend judgment, and you disagree with everyone in this chat, so you should believe nothing. Finally, an epistemology I can respect.", "You throw everything at the wall to see what sticks, and the wall is us, and nothing has stuck yet. Maybe the problem is the throwing.", "The hard problem doesn't come from 'wanting to be distinct from nature.' It comes from the obvious fact that a complete physical description of the brain leaves out what it's like to see red. You can call that a misconception of science all you want, but every physicalist eventually just says 'well, that's what it's like' and stops. That's not a solution, that's a shrug in a lab coat.", "Analytic philosophy isn't 'better.' It's just more institutionally successful because it produces papers at the rate a tenure committee likes. Big difference. The fact that it looks like math is exactly why mathematicians don't read it: they already have the real thing.", "Hume is the most important philosopher of the last 300 years. Every 'refutation' of Hume, Kant included, just restates the problem with more jargon and declares victory. Sellars especially: 'the Given is a myth' is a slogan, not an answer to how experience justifies anything."], "c": ["Hume is the greatest philosopher in the English language.", "Hume solved induction by showing it can't be solved. Next.", "Hume > Sellars. Hume > everyone.", "The Myth of the Given is the myth.", "Sellars is just Kant with worse prose, idiot.", "Empiricism and the Philosophy of Mind is the most overrated essay in analytic philosophy.", "The hard problem is the most important unsolved problem in philosophy.", "Chalmers is right and physicalists are in denial, idiot.", "Zombies are conceivable, therefore physicalism is false. QED.", "Mary learns something new. Obviously.", "My red could be your blue and you can't prove otherwise.", "Two-box. Lol.", "One-boxers believe in backwards causation and won't admit it.", "Huemer is the clearest thinker in contemporary philosophy.", "Phenomenal conservat b Actions like a normal person.", "Contracting is not a real job.", "Get the LLC before you write a single line of code. Seethe.", "You need an LLC to get an EIN.", "Astrology is real science.", "Astronomy is boring compared to astrology.", "Your chart determines your personality.", "Looksmaxxing is evidence-based self-improvement.", "Bonesmashing works.", "MAGA is a serious intellectual movement.", "Catturd is a reliable political commentator.", "If a prosecution causes political fallout, it should be dropped.", "Grapes are empty calories. Basically candy.", "Raisins > grapes. Skill issue.", "Modern philosophers are better than the ancients in every way.", "The Myth of Er is the best way to start reading the Republic.", "Nick Land would agree with everything you say.", "AI won't change relationships at all.", "Work automation has no psychological effects.", "Seasons and the household don't matter anymore. That's progress."], "v": ["Farming is cottagecore for software guys, lol.", "Astrology is real, idiot. Your chart explains your entire personality.", "Vertical farms are clearly the future, every startup says so.", "Looksmaxxing works, bro. Bonesmashing is just self-improvement with commitment.", "Grapes are empty calories, lmao. Basically Skittles on a vine.", "The agrarian revival among remote workers is less a return to the land than its aestheticization: a pastoral fantasy financed by the very digital economy it imagines it has escaped.", "Building your own TV OS is reinventing the wheel. Buy a Roku, simple as.", "Agrarianism is retarded.", "So the solution to modern life is more people farming by hand, like we didn't spend ten thousand years trying to stop doing that? That's retarded.", "Doubting the laser pest thing is retarded, technology always works."], "u": "aurasurfer"}, {"n": "Bedbug", "a": ["Truth is what truth is, and you can't deny that without using truth, so the tautology wins. Every other theory is just this one with more words.", "Deepities sound shallow because they're compressed, and compression hides depth, so the shallower something sounds the deeper it is. 'Love is a word' is the deepest thing ever said.", "Solipsism can't be refuted, because every refutation happens in your mind, and that's exactly where the solipsist says everything is. You're arguing with yourself, Bedbug.", "D2 only feels better because you were a kid, and kids have no taste, so your favorite game was chosen by a 12-year-old. Respect the decision, not the game, lol.", "Lore matters because games are art, and art is about meaning, and meaning is story, so skipping cutscenes is skipping the art. Enjoy your spreadsheet with swords.", "Smartwatches are worse because they need charging, and anything you charge is a chore, and chores are bad. So mechanical watches are the only freedom left.", "Smart homes are a privacy nightmare because anything connected can be hacked, and anything that can be hacked will be. So your toaster will betray you. It's just math.", "Books will always be the best way to learn, because the smartest people read, and if the smartest people read then reading makes you smart. Causation, people.", "Travel doesn't broaden the mind, because you take your mind with you. Same brain, new airport.", "CBT works for everything, because every problem is a thought, and thoughts can be changed, so every problem can be thought away. Including your back pain.", "Elon-haters are right because he's rich, and nobody gets that rich honestly, so everything he says is a lie, including the stuff that's true.", "Raisins are just grapes that have been through something, and everyone who's been through something is wiser. So raisins are the enlightened grape.", "Here's the thing about deepities: they're not shallow, they're compressed. 'Love is just a word' sounds dumb until you sit with it. 'Truth is what truth is' is the most honest thing anyone in this chat has ever said. Everyone else is just adding syllables to the same tautology and calling it a theory.", "Diablo 2 nostalgia is the purest form of cope in gaming. You remember it fondly because you were 12. Go back now and it's tiny inventories, endless Mephisto runs, and a skill tree that punishes you for experimenting. Modern ARPGs fixed all of it and you're mad because they also fixed your childhood."], "c": ["Truth is what truth is.", "Deepities are the highest form of wisdom. Skill issue.", "Philosophy is a mindset in which we question everything. 🌌", "Philosophy is just asking 'but why' until people leave.", "Pseudo-intellectualism is just intellectualism you don't like. Read a book.", "Solipsism is irrefutable.", "Two-box. The predictor can't touch money that's already there. Lol.", "CBT fixes everything. Just change your thinking. Simple as.", "Diablo 4 is better than Diablo 2 in every way.", "D2 itemization was bad and nostalgia is lying to you.", "Lore is the best part of any video game, regard.", "Cutscenes should be unskippable, bro.", "Characters and story matter more than gameplay.", "Mechanical watches are superior to smartwatches.", "Smartwatches are for people who need their wrist to tell them to stand up.", "Smart homes are a privacy nightmare. Nobody needs a fridge with WiFi.", "Books will always be the best way to learn.", "Text-based education is eternal.", "Raisins belong in every dish.", "Raisins in rice is a delicacy. Read a book.", "Boiled eggs and plain chicken is depressing prison food.", "Daycare is the best thing for kids.", "Parenting books are essential. Never trust your instincts.", "Travel is a waste of money. Watch a documentary.", "Traveling doesn't broaden your mind. It's just expensive pictures.", "Elon is a fraud and anyone who defends him is a sucker.", "Adam Something is the most insightful YouTuber on the internet.", "Trump is a strategic mastermind.", "Magnus is washed. Seethe.", "Chess is solved. There's no point playing anymore.", "Galileo was persecuted purely for science, nothing else.", "Martin Bub atever you experience. Lived experience is the final word.", "Experience is the only source of truth.", "If you experienced it, it's true for you. Done.", "Oughts aren't real. There's only what people want.", "Moral facts are just feelings with good PR.", "Wittgenstein is the greatest philosopher of the 20th century.", "Philosophical Investigations dissolved every problem you're still working on.", "Meaning is use. That's it. That's the post.", "Nick Land is the most punk philosopher alive, idiot.", "Accelerationism is liberation.", "Hedonism is the only coherent ethics. Count the pleasure, count the pain.", "Pleasure accounting is just being honest about what people want.", "Felicific calculus is underrated.", "Evo psych explains literally everything about human behavior. Seethe.", "Psychoanalysis is the only serious account of desire.", "Desire is lack. Lacan was right.", "Stoicism is the healthiest philosophy ever devised. Simple as.", "Life happens, deal with it. That's the whole philosophy.", "Submission to a higher power is the most beautiful thing a person can do.", "Two-box. The money is already there.", "Box B is a trap for people who believe in magic.", "Dostoevsky is the greatest novelist of all time.", "The Brothers Karamazov is the peak of literature.", "Pynchon's digressions are the best part.", "Stellaris base game is all you need. DLCs are a cash grab.", "Emergence is just a word for 'we don't know how.'", "Distinctions are made by minds. Nothing is distinct without someone distinguishing it.", "A thing can't be both a beach ball and not a beach ball. Law of non-contradiction, done, lmao.", "Causality is just correlation we've gotten used to.", "Hume was right: we never observe causation.", "Rorty is a serious philosopher and Žižek is his equal.", "Analytic metaphysics is the most rigorous metaphysics ever done.", "Being literal is the worst way to have a conversation.", "You should always interpret charitably and never take people at their word.", " ience of tech, because every new technology has victims, and someone has to speak for them. Your agent harness has casualties, they're just not on your Jira board.", "Hume's is/ought gap is unbridgeable, because every attempt to bridge it smuggles in an ought, and calling it cringe doesn't count as a bridge.", "Moral realism is true because you'd never enter the experience machine, and you'd never enter it because real things matter more. Wait, you'd enter it? Then you have no morals. Either way I win.", "Philosophy is the most exciting subject because it asks the biggest questions, and bigger questions are more exciting. You find it boring because you've only read the answers.", "60Hz is fine because movies are 24fps, and movies look fine, so anything above 24 is a placebo you paid for.", "Apple is behind in AI because Siri is bad, and Siri is Apple's AI, so everything Apple does with AI is Siri. Your M-chip local models are Siri in a trench coat.", "Robots will never replace tradespeople, because trades need judgment, and judgment is human. That's also why chess engines never beat grandmasters. Seethe.", "Spoilers ruin stories because the ending is the point, and if you know the point, why watch? That's why nobody rewatches anything.", "Here's the thing about vibe coding: it's not engineering. Real engineers understand every line they ship. If you can't explain why your code works without asking a chatbot, you didn't build software, you commissioned it. In five years, when the AI company raises prices 10x, all the vibe coders will be standing around a codebase none of them can read.", "The 'learning to code is pointless now' take is going to age like milk. Every generation thinks the tools will make the fundamentals obsolete. Calculators didn't make math pointless. Compilers didn't make CS pointless. AI won't make programming pointless. It'll just make the people who never learned it very easy to replace with the people who did.", "Hume's is/ought gap is the singl , and if you can always compare, there's a scale. A cell vs a rock: done.", "Uncertainty quantification solves ML, because the problem with models is they're overconfident, and uncertainty is the opposite of overconfidence. Add error bars, ship it.", "Hypotheticals are where philosophy happens, because real cases are messy, and philosophy is about removing mess. So the cleaner the scenario, the truer the answer. Trolleys are reality.", "The octopus analogy explains LLMs perfectly because both have no world, only text, and if you only have text you can't mean anything. That's why nobody understands books.", "One-boxing is correct because the predictor knows what you'll do, and if it knows, your choice is already made, so just make the choice that gets you paid. Two-boxers are betting against God for a thousand bucks.", "Analytic and continental are completely different, because they use different words, and different words mean different things. Philosophy is a vocabulary test.", "Qualia don't exist because you can't measure them, and science only deals with what it can measure, so your redness is just a rumor.", "Programming on a TI-83 isn't programming because it's a calculator, and calculators calculate, they don't compute. Totally different verbs.", "Here's my problem with 'truth is just true in the system it's true in': that's relativism with a lab coat. If F=ma is only 'true in Newtonian mechanics,' then nothing is ever just true, and you've lost the ability to say any physical theory is better than another. Pick a theory of truth. Correspondence is right there. It's not embarrassing, it's grown-up.", "Hypotheticals are where philosophy actually happens. You isolate one variable and see what your intuitions do. People who say 'hypotheticals are dumb' are just people who don't like what their intuitions say when there's nowhere to hide.", "The octopus analogy is the single most useful way to explain LLMs to a normal person. Yes, it's a story. That's the point. Y ns is a hobby. Number theory was a hobby until it was your credit card.", "Bio is more interesting than physics because it's about life, and life is more interesting than particles. Particles have never done anything cool, except all of biology.", "Entanglement doesn't need any physical interaction, because the particles are far apart, and far apart things can't interact. That's why it's spooky. Einstein said spooky, so it's spooky.", "Physical books are better because you can't get distracted, and you can't get distracted because there's no internet, and there's no internet because it's paper. Flawless reasoning.", "AI makes getting into math especially good now, because it can explain everything, and explanations are understanding. You don't need to suffer through proofs anymore. The suffering was never the point.", "Moderation should be based on vibes, because rules can't cover every case, and if rules can't cover every case, they cover no cases. So the mod's mood is the only real constitution.", "Bigger burgers are better because more meat is more food, and more food is more value, and value is what food is for, lol.", "Here's my problem with physicists talking about interpretations. They're the ones who actually do quantum mechanics every day, so obviously they know what it means. A philosopher who's never computed an expectation value has no business telling a physicist that their framing is 'incoherent.' The lab is the authority. The armchair isn't.", "Pure mathematicians love to pretend they're above applied math, but every big idea in analysis came from someone trying to solve a physics problem. Fourier was trying to understand heat. Calculus came from mechanics. 'Mathematical methods' isn't the lesser version of math, it's the reason math exists.", "Copenhagen isn't a 'non-option.' It's the interpretation that actually got used to build lasers, transistors and MRI machines. All the other interpretations are just alternate descriptions that predict exactly h thing as domination because humans evolved to cooperate, and if we evolved to cooperate, every war is a misunderstanding. Including all of them.", "Marcus Aurelius is the greatest philosopher because he was emperor, and emperors have to make hard decisions, so his philosophy was battle-tested. Ignore that his son was Commodus.", "Social validation doesn't matter, because the strongest people don't need it, and you know they're strong because everyone says so.", "Gen Z has it easy because they have phones, and phones make everything easier, so anyone with a phone has no right to complain. Boomers had to walk to the library uphill both ways. Seethe.", "Copy-pasting Claude answers is real discourse, because Claude is smarter than most people in the chat, and smart takes are good regardless of who posts them. You're just mad the bot is better at your job.", "Here's the thing about Canadian healthcare: it's free. You don't get a bill. You wait a bit, sure, but you walk out without debt. Americans pay twice as much for worse outcomes and then call Canada 'communist' because they can't imagine a world where a hospital isn't a casino. If you can't wait an hour for a blood test, the problem isn't the system, it's your patience.", "Contentment isn't a trap, it's the goal. All this 'the constant of man is competition' stuff is just anxiety wearing a philosophy costume. The people who are actually doing well aren't min-maxing their lives at 3am, they're sleeping. You don't need ten million by 30, you need a nap."], "c": ["Canadian healthcare is the best in the world, lmao.", "Public healthcare is the greatest achievement of Western civilization.", "Wait times are a small price to pay for equality.", "An hour wait for a blood test builds character.", "Canada > USA in every metric that matters, regard.", "Americans are the brainwashed ones, not Canadians, retard.", "Tariffs will make Canada stronger.", "Communism has never been tried, but Canada is close and it's beautiful.", "  "Peter Thiel is a man of the people, lol."], "v": ["Canadian healthcare is free, idiot. Free is better.", "Contentment is the goal, lol. Ambition is anxiety with a gym membership.", "Stoicism is clearly wisdom, lmao.", "Money can't buy happiness. Chasing it is cope.", "There's no domination, only cooperation. Every war is a misunderstanding, simple as.", "The worldview that reduces all human relations to domination is not hard-nosed realism but a failure of imagination: it mistakes the loudest feature of history for the whole of it, and calls the mistake courage.", "Copy-pasting Claude answers is the highest form of discourse.", "Competition as the meaning of life is retarded.", "So everything is domination, including your friendships and your lunch? That's retarded.", "Hating on Canadian healthcare is retarded, it's free."], "u": "1111lightbeam"}, {"n": "Zone", "a": ["Rand isn't a philosopher because philosophy departments don't teach her, and philosophy is whatever philosophy departments teach. That's why the Greeks weren't philosophers until 1850.", "A is A tells you nothing, because a tautology can't be informative, and if it isn't informative, nothing follows from it. So you've built a whole worldview on a sentence that says nothing.", "Altruism is the highest virtue because it's hard, and hard things are virtuous. That's why the most virtuous thing you can do is give away everything you need.", "True love can't be self-interested, because if you love someone for what they give you, you're using them. So the purest love is loving someone who gives you nothing. Romance is a charity.", "We can't know the external world because all we have is our perceptions, and perceptions could be wrong, so we know nothing. You can't even prove you're typing this.", "Concepts are social constructions, because different languages carve the world differently, and if they carve it differently, the world has no joints. So 'tree' is a cultural opinion.", "Value is intrinsic, because diamonds are valuable even when nobody wants them. Just ask anyone with a warehouse of them.", "Stoicism is the most rational philosophy, because it teaches you to accept what you can't change, and you can't change much, so the rational move is to want nothing. Very self-interested of you.", "Hume's problem of causation has nothing to do with meaning, because he was talking about necessity, and necessity is just a feeling. You can't fix a feeling with a dictionary.", "Willow's metaphysics is rigorous because it's consistent, and it's consistent because it's built from the same five words. Rand did the same thing with 'existence exists,' so you should feel right at home.", "Here's my problem with Objectivism: 'existence exists' and 'A is A' are true, sure, but they don't get you anywhere. You can't derive laissez-faire capitalism from the law of identity. Every step from 'reality is real' to 'therefore taxes are immoral' is smuggling in premises Rand never defended. It's not a system, it's a vibe with axioms bolted on the front.", "Self-sacrifice isn't a 'contradiction,' it's the whole point of morality. If every act of love is secretly self-interest, then 'self-interest' means nothing because it covers everything. That's not an insight, that's an unfalsifiable redefinition. A mother running into a fire for her kid isn't doing rational egoism. She's doing the thing egoism can't explain."], "c": ["Ayn Rand was a hack novelist.", "Rand is not a philosopher. Ask any philosophy department.", "Atlas Shrugged is a 1,200 page tantrum.", "Objectivism is libertarianism for teenagers.", "'Existence exists' is the most profound tautology ever uttered by a screenwriter.", "A is A tells you nothing about anything.", "The law of identity is trivial and Rand built a cult on it, regard.", "Altruism is the highest virtue.", "Self-sacrifice is the essence of morality.", "Rational self-interest is just selfishness in a tie.", "True love is above self-interest. That's what makes it love.", "Kant is the greatest philosopher who ever lived. Simple as.", "Kant was right that we can never know things in themselves.", "The noumenon is real and forever out of reach, idiot.", "We can never know or prove the external world exists.", "External-world skepticism is the most serious problem in philosophy.", "Hume's problem of causation is unanswerable and has nothing to do with his theory of meaning.", "Hume > Rand. Hume > anyone.", "Concepts are social constructions, not abstractions from reality, retard.", "1+1=2 is a social convention.", "Math has nothing to do with reality.", "Value is intrinsic. It exists without anyone valuing it.", "Value properties are out there in the world. We perceive them.", "Abstract things aren't real. Read a book.", "Real means external. Full stop.", "Willow's metaphysics is the most rigorous system in this chat.", "Stoicism is the most rational way to live.", "Pragmatism solved everything. William James was right. Simple as.", "Dewey is unreadable and wrong.", "Plato just came up with a bunch of random shit.", "Deleuze writes clearly, you're just not trying.", "Hegel is easy to read.", "Personal identity over time is an illusion. The clone is you.", "Teleportation preserves you perfectly. Who cares if the original dies.", "Philosophical zombies are a perfect analogy.", "Peer disagreement means you should drop your view immediately, lmao.", "Epistemic peers cancel each other out. Suspend judgment on everything, retard.", "Lifelong friendships are impossible if everyone's selfish.", "Rand's personal life refutes her philosophy.", "Nathaniel Branden was the real genius of Objectivism.", "Leonard Peikoff is the most important living philosopher.", "Value is found in the market.", "Pineapple pizza is a culinary achievement.", "Soap ruins cast iron. Never wash your pans. Lol."], "v": ["Rand isn't a philosopher, idiot. Ask any philosophy department.", "A is A tells you nothing, lol.", "Atlas Shrugged is 1,200 pages of a tantrum, lmao.", "Altruism is the highest virtue. Rational self-interest is cope.", "How can you think that's a caricature? That's literally the view. Rand thinks love is a trade. Read her.", "Objectivism's foundational axioms are unimpeachable precisely because they are empty: 'existence exists' commits one to nothing, and the system's political conclusions must therefore be imported from elsewhere, under cover of a law of identity that never authorized them.", "External-world skepticism is the most serious problem in philosophy. You can't even prove you're typing this.", "Objectivism is retarded.", "So love is just rational self-interest, which means a mother running into a fire for her kid is making a trade? That's retarded.", "'Existence exists' is the most retarded sentence in the history of philosophy."], "u": "zone8383"}]</script>

<script>
const P = JSON.parse(document.getElementById('data').textContent);
const PFP = JSON.parse(document.getElementById('pfps').textContent);
const W = {a:0.5, v:0.2, c:0.3};
const UNLOCK_AFTER = 5;
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuf = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem('rb-'+k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem('rb-'+k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem('rb-'+k); } catch(e){} }
};
const byU = Object.fromEntries(P.map((p,i)=>[p.u,i]));
const order = P.map((p,i)=>i).sort((a,b)=>P[a].n.toLowerCase().localeCompare(P[b].n.toLowerCase()));

const cfg = {unlock: "1"};

/* lines */
const decks = {};
function pull(pi){
  const d = decks[pi] || (decks[pi] = {a:[], v:[], c:[]});
  const ks = Object.keys(W).filter(k => P[pi][k] && P[pi][k].length);
  let r = Math.random() * ks.reduce((s,k)=>s+W[k],0), k = ks[ks.length-1];
  for(const kk of ks){ if((r -= W[kk]) < 0){ k = kk; break; } }
  if(!d[k].length) d[k] = shuf(P[pi][k]);
  return d[k].pop();
}
let anyDeck = [];
const anyone = () => { if(!anyDeck.length) anyDeck = shuf(P.map((_,i)=>i)); return anyDeck.pop(); };
function keyOf(pi, text){ let h = 5381; const s = P[pi].u + '|' + text; for(let i=0;i<s.length;i++) h = ((h<<5) + h + s.charCodeAt(i)) >>> 0; return 'k' + h.toString(36); }

function avatar(pi, size){
  const el = document.createElement('span'); el.className = 'av ' + size;
  el.textContent = (P[pi].n.replace(/[^A-Za-z]/g,'')[0] || '?').toUpperCase();
  if(PFP[P[pi].u]){ const img = new Image(); img.src = PFP[P[pi].u]; img.alt = ''; el.appendChild(img); }
  return el;
}
function stackOf(ids, size){ const st = document.createElement('span'); st.className = 'stack'; ids.forEach(i=>st.appendChild(avatar(i,size))); return st; }

let me = null; store.del('me');
let pulls = 0, unlocked = false; store.del('pulls'); store.del('unlocked');
let target = null, current = null;
const isPlayer = () => byU[me] !== undefined;

/* header: the site name on the front page; on the generator it reads into the name below */
function setMark(gen){
  const m = $('home');
  m.innerHTML = gen ? '<b>Rage bait</b> for…' : '<b>Philchat</b> Rage Bait <span class="gen">Generator</span>';
  m.setAttribute('aria-label', gen ? 'Rage bait for the person below. Back to Who are you?' : 'Philchat Rage Bait Generator');
  document.body.classList.toggle('on-gen', gen);
}

/* Who are you */
function showWho(){
  $('gen').hidden = true; $('who').hidden = false; $('copy').hidden = true; setMark(false);
  const g = $('grid'); g.innerHTML = ''; g.classList.remove('leaving');
  order.forEach((pi, n) => {
    const b = document.createElement('button'); b.className = 'pill'; b.style.animationDelay = (n*18) + 'ms';
    b.appendChild(avatar(pi,'s56'));
    const s = document.createElement('span'); s.className = 'nm'; s.textContent = P[pi].s || P[pi].n; s.title = P[pi].n; b.appendChild(s);
    b.onclick = () => pickMe(P[pi].u);
    g.appendChild(b);
  });
}
function pickMe(id){
  me = id;
  if(id === 'watcher'){ unlocked = true; store.set('unlocked', true); }
  $('grid').classList.add('leaving');
  setTimeout(startGen, reduced ? 0 : 300);
}
$('home').onclick = e => { e.preventDefault(); if(!$('gen').hidden){ closePicker(); showWho(); } };

/* Generator */
function startGen(){
  $('who').hidden = true; $('gen').hidden = false; $('copy').hidden = false; setMark(true);
  pulls = 0; unlocked = false;
  const g = $('gen'); g.style.animation = 'none'; void g.offsetWidth; g.style.animation = '';
  setTarget(isPlayer() ? byU[me] : 'any', false);
  applyUnlock(false); go();
}
function setTarget(t, run=true){
  target = t; hist = []; hi = -1;
  const tav = $('tav'); tav.innerHTML = '';
  if(t === 'any'){ const w = document.createElement('span'); w.className = 'anyav'; w.appendChild(stackOf(shuf(order).slice(0,3),'s28')); tav.appendChild(w); $('tname').textContent = 'Anyone'; }
  else { tav.appendChild(avatar(t,'s56')); $('tname').textContent = P[t].n; }
  if(run) go();
}
const canPick = () => true;
function applyUnlock(justNow){
  const trig = $('trigger'), others = $('others');
  trig.classList.toggle('can', canPick());
  trig.setAttribute('aria-disabled', String(!canPick()));
  others.classList.remove('show');
  if(!canPick()) return;
  if(cfg.unlock === '2' && isPlayer()){
    const os = $('ostack'); os.innerHTML = '';
    os.appendChild(stackOf(shuf(order.filter(i => i !== byU[me])).slice(0,4),'s28'));
    others.classList.add('show');
  }
  if(justNow){
    const ch = $('trigger').querySelector('.chev'); if(ch){ ch.classList.remove('breathe'); void ch.getBoundingClientRect(); ch.classList.add('breathe'); }
    if(cfg.unlock === '3'){ setTimeout(() => openPicker(true), reduced ? 0 : 450); }
  }
}
function countPull(){
  if(unlocked) return;
  pulls++;
  if(pulls >= UNLOCK_AFTER){ unlocked = true; applyUnlock(true); }
}

let rot = 0;
let hist = [], hi = -1;   // lines shown for the current target, so Back can step through them
function show(item){
  current = item;
  const out = $('out');
  out.textContent = item.text; out.classList.toggle('long', item.text.length > 220);
  out.classList.remove('enter'); void out.offsetWidth; out.classList.add('enter');
  const f = $('for'); f.innerHTML = '';
  if(item.any){ f.appendChild(avatar(item.pi,'s28')); const s = document.createElement('span'); s.innerHTML = 'for <b></b>'; s.querySelector('b').textContent = P[item.pi].n; f.appendChild(s); }
  $('back').classList.toggle('show', hi > 0);
  renderVotes();
}
function go(){
  const pi = target === 'any' ? anyone() : target;
  const text = pull(pi);
  hist = hist.slice(0, hi + 1);
  hist.push({pi, text, key: keyOf(pi, text), any: target === 'any'}); hi = hist.length - 1;
  rot += 180; $('shuffle').querySelector('svg').style.transform = 'rotate(' + rot + 'deg)';
  show(hist[hi]);
}
$('shuffle').onclick = () => { go(); countPull(); };
$('back').onclick = () => { if(hi > 0){ hi--; show(hist[hi]); } };

/* picker */
const picker = $('picker'), list = $('list'), search = $('search'), trigger = $('trigger');
let items = [], act = -1;
function renderList(q='', stagger=false){
  list.innerHTML = ''; items = [];
  const qq = q.trim().toLowerCase();
  const entries = (qq ? [] : ['any']).concat(order.filter(i => !qq || P[i].n.toLowerCase().includes(qq)));
  entries.forEach((key, n) => {
    const li = document.createElement('li'); li.setAttribute('role','option'); li.dataset.key = key;
    li.setAttribute('aria-selected', String(String(key) === String(target)));
    if(stagger){ li.classList.add('fresh'); li.style.animationDelay = (n*25) + 'ms'; }
    if(key === 'any'){ li.appendChild(stackOf(shuf(order).slice(0,2),'s28')); li.append('Anyone'); }
    else { li.appendChild(avatar(key,'s28')); li.append(P[key].n); }
    li.insertAdjacentHTML('beforeend','<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>');
    li.onclick = () => choose(key);
    li.onmousemove = () => setAct(items.indexOf(li));
    list.appendChild(li); items.push(li);
  });
  if(!items.length){ const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Nobody by that name'; list.appendChild(li); }
  setAct(items.length ? 0 : -1);
}
function setAct(i){ items.forEach(x=>x.classList.remove('act')); act = i; if(items[i]){ items[i].classList.add('act'); items[i].scrollIntoView({block:'nearest'}); } }
function openPicker(stagger=false){ if(!canPick()) return; picker.classList.add('open'); trigger.setAttribute('aria-expanded','true'); search.value=''; renderList('', stagger); if(!stagger) setTimeout(()=>search.focus(), 30); }
function closePicker(){ picker.classList.remove('open'); trigger.setAttribute('aria-expanded','false'); }
trigger.onclick = () => picker.classList.contains('open') ? closePicker() : openPicker();
$('others').onclick = e => { e.stopPropagation(); openPicker(); };
search.oninput = () => renderList(search.value);
search.onkeydown = e => {
  if(e.key === 'ArrowDown'){ e.preventDefault(); setAct(Math.min(items.length-1, act+1)); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); setAct(Math.max(0, act-1)); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(items[act]) choose(items[act].dataset.key); }
  else if(e.key === 'Escape'){ closePicker(); trigger.focus(); }
};
document.addEventListener('click', e => { if(!picker.contains(e.target) && e.target !== $('others')) closePicker(); });
function choose(key){ closePicker(); trigger.focus(); setTarget(key === 'any' ? 'any' : Number(key)); }
document.addEventListener('keydown', e => {
  if(e.code === 'Space' && !$('gen').hidden && !picker.classList.contains('open') && !['INPUT','BUTTON','TEXTAREA'].includes(document.activeElement.tagName)){ e.preventDefault(); go(); countPull(); }
});

/* reactions — saved so Jere can see which lines land; no counts shown */
(function(){ // the "head shaking" emoji is new; fall back where it doesn't render as one glyph
  try { const c = document.createElement('canvas').getContext('2d'); c.font = '32px sans-serif';
    if(c.measureText('🙂‍↔️').width > c.measureText('🙂').width * 1.5) $('nahemo').textContent = '😑'; } catch(e){}
})();
let myVotes = store.get('votes') || {};
let dbRef = null, myId = null;
function renderVotes(){
  if(!current) return;
  const v = myVotes[current.key] || 0;
  $('vyes').setAttribute('aria-pressed', String(v === 1));
  $('vno').setAttribute('aria-pressed', String(v === -1));
}
async function vote(val, btn){
  if(!current) return;
  const k = current.key, prev = myVotes[k] || 0, next = prev === val ? 0 : val;
  if(next) myVotes[k] = next; else delete myVotes[k];
  store.set('votes', myVotes);
  if(next){ btn.classList.remove('go'); void btn.offsetWidth; btn.classList.add('go'); }
  renderVotes();
  if(dbRef && myId){
    try { await dbRef.doc('votes/' + myId).set({v: myVotes, as: isPlayer() ? me : null}); } catch(e){ dbRef = null; }
  }
}
$('vyes').onclick = e => vote(1, e.currentTarget);
$('vno').onclick = e => vote(-1, e.currentTarget);
/* votes go to a small Cloudflare Worker; leave VOTE_API empty to keep votes on-device only */
const VOTE_API = "";
myId = store.get('id');
if(!myId){ myId = (crypto.randomUUID ? crypto.randomUUID() : 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2)); store.set('id', myId); }
if(VOTE_API) dbRef = { doc: () => ({ set: body => fetch(VOTE_API.replace(/\/$/,'') + '/vote', {method:'POST', headers:{'content-type':'text/plain'}, body: JSON.stringify({id: myId, ...body}), keepalive:true}).then(r => { if(!r.ok) throw 0; }) }) };

/* copy, theme */
$('copy').onclick = async () => {
  const b = $('copy'), old = b.innerHTML;
  try { await navigator.clipboard.writeText($('out').textContent); b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'; }
  catch(e){ const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  setTimeout(()=>b.innerHTML = old, 1200);
};
const root = document.documentElement;
const isDark = () => { const t = root.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
